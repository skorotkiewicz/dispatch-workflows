name: Build and release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Ignore deletion or force-updates of an existing tag.
    if: github.event.created == true && github.event.deleted == false
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2025
            platform: win-x64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set application version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          const numeric = '(?:0|[1-9][0-9]*)';
          const identifier = '(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)';
          const metadata = '[0-9A-Za-z-]+';
          const semver = new RegExp(`^${numeric}[.]${numeric}[.]${numeric}(?:-${identifier}(?:[.]${identifier})*)?(?:[+]${metadata}(?:[.]${metadata})*)?$`);
          if (!semver.test(version)) {
            throw new Error('Release tags must be semantic versions, such as v1.2.3 or v1.2.3-beta.1.');
          }
          appendFileSync(process.env.GITHUB_ENV, `DISPATCH_VERSION=${version}\n`);
          NODE

      - name: Test backend and queue behavior
        run: npm test

      - name: Build desktop release
        run: npm run desktop:build

      - name: Upload installers and update bundles
        uses: actions/upload-artifact@v7
        with:
          name: dispatch-${{ matrix.platform }}
          path: dist/electrobun/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download every platform build
        uses: actions/download-artifact@v8
        with:
          pattern: dispatch-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          options=(--verify-tag --title "Dispatch $RELEASE_TAG" --generate-notes)
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${options[@]}" release-artifacts/*

  aur-publish:
    name: Publish to AUR
    needs: release
    # The stable AUR package follows plain X.Y.Z tags, with an optional v prefix.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: aur-dispatch-workflows-bin
      cancel-in-progress: false
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up builder user
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git openssh pacman-contrib sudo curl desktop-file-utils
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          cp LICENSE arch/LICENSE
          chown -R builder:builder "$GITHUB_WORKSPACE/arch"

      - name: Update PKGBUILD and generate .SRCINFO
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          sed -i "s/^pkgver=.*/pkgver=$version/" arch/PKGBUILD
          sed -i 's/^pkgrel=.*/pkgrel=1/' arch/PKGBUILD
          sed -i "s/^_tag=.*/_tag=$RELEASE_TAG/" arch/PKGBUILD
          desktop-file-validate arch/dispatch-workflows.desktop
          sudo -u builder bash -s -- "$GITHUB_WORKSPACE/arch" <<'BUILD'
          set -euo pipefail
          cd "$1"
          updpkgsums
          makepkg --printsrcinfo > .SRCINFO
          makepkg --nodeps --noconfirm
          BUILD

      - name: Upload prepared AUR metadata
        uses: actions/upload-artifact@v7
        with:
          name: aur-package-metadata
          path: |
            arch/PKGBUILD
            arch/.SRCINFO
            arch/LICENSE
            arch/dispatch-workflows.desktop
          include-hidden-files: true
          if-no-files-found: error

      - name: Publish AUR package
        # v4.1.3 fixes the runuser/Bash invocation used by v4.1.2.
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: dispatch-workflows-bin
          pkgbuild: ./arch/PKGBUILD
          assets: |
            ./arch/.SRCINFO
            ./arch/LICENSE
            ./arch/dispatch-workflows.desktop
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: 'aur: ${{ github.ref_name }}'
          ssh_keyscan_types: rsa,ecdsa,ed25519
