name: Build and release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.0

jobs:
  build:
    # Ignore deletion or force-updates of an existing tag.
    if: github.event.created == true && github.event.deleted == false
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            binary: dispatch
          - runner: windows-2025
            platform: win-x64
            target: x86_64-pc-windows-msvc
            binary: dispatch.exe
          - runner: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
            binary: dispatch
          - runner: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            binary: dispatch
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python for release packaging
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1

      - name: Install Rust toolchain
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target "$BUILD_TARGET"
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set application version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/release.py set-version "$RELEASE_TAG"

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Test release packaging
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Test backend and queue behavior
        run: cargo test --locked --no-default-features

      - name: Check native desktop build
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo clippy --locked --target "$BUILD_TARGET" --all-targets -- -D warnings

      - name: Test native UI behavior
        if: runner.os == 'Linux'
        run: cargo test --locked --bin dispatch

      - name: Build native desktop release
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$BUILD_TARGET" --bin dispatch

      - name: Package native release
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BINARY: ${{ matrix.binary }}
        run: |
          python .github/scripts/release.py package \
            --platform "$RELEASE_PLATFORM" --version "$DISPATCH_VERSION" \
            --binary "target/$BUILD_TARGET/release/$BUILD_BINARY" --output dist

      - name: Upload native release archive
        uses: actions/upload-artifact@v7
        with:
          name: dispatch-${{ matrix.platform }}
          path: dist/dispatch-workflows-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download every platform build
        uses: actions/download-artifact@v8
        with:
          pattern: dispatch-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate archive checksums
        working-directory: release-artifacts
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          options=(--verify-tag --title "Dispatch $RELEASE_TAG" --generate-notes)
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${options[@]}" release-artifacts/*

  aur-publish:
    name: Publish to AUR
    needs: release
    # The stable AUR package follows plain X.Y.Z tags, with an optional v prefix.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: aur-dispatch-workflows-bin
      cancel-in-progress: false
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up builder user
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git openssh pacman-contrib sudo curl desktop-file-utils
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE/arch"

      - name: Update PKGBUILD and generate .SRCINFO
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          sed -i "s/^pkgver=.*/pkgver=$version/" arch/PKGBUILD
          sed -i 's/^pkgrel=.*/pkgrel=1/' arch/PKGBUILD
          sed -i "s/^_tag=.*/_tag=$RELEASE_TAG/" arch/PKGBUILD
          desktop-file-validate arch/dispatch-workflows.desktop
          sudo -u builder bash -s -- "$GITHUB_WORKSPACE/arch" <<'BUILD'
          set -euo pipefail
          cd "$1"
          updpkgsums
          makepkg --printsrcinfo > .SRCINFO
          makepkg --nodeps --noconfirm
          BUILD

      - name: Upload prepared AUR metadata
        uses: actions/upload-artifact@v7
        with:
          name: aur-package-metadata
          path: |
            arch/PKGBUILD
            arch/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error

      - name: Publish AUR package
        # v4.1.3 fixes the runuser/Bash invocation used by v4.1.2.
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: dispatch-workflows-bin
          pkgbuild: ./arch/PKGBUILD
          assets: ./arch/.SRCINFO
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: 'aur: ${{ github.ref_name }}'
          ssh_keyscan_types: rsa,ecdsa,ed25519
