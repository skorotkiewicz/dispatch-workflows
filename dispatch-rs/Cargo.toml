[package]
name = "dispatch-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Native desktop runner for sequential GitHub Actions workflows"

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:gpui_platform", "dep:unicode-segmentation"]

[[bin]]
name = "dispatch"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
gpui = { package = "gpui-pre", version = "=0.3.9", optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["wayland", "x11"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
unicode-segmentation = { version = "1", optional = true }
url = "2"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
